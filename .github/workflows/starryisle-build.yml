name: StarryIsle build

# Manual runs build the installer for testing; pushing a v* tag also publishes a
# GitHub release with the installer and the updater manifest attached.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: starryisle-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows installer
    runs-on: windows-2025
    env:
      SQLX_OFFLINE: 'true'
      CARGO_PROFILE_RELEASE_LTO: 'true'
      CARGO_TERM_COLOR: always

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.95.0'

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build installer UI
        run: node scripts/axolotl/build-desktop.mjs --profile release --installer-only

      - name: Prepare build resources
        run: node scripts/axolotl/prepare-build-resources.mjs

      - name: Build application and bundle
        run: node scripts/axolotl/build-desktop.mjs --profile release
        env:
          AXOLOTL_BUILD_RESOURCES: ${{ github.workspace }}/target/build-resources

      - name: Bundle NSIS installer
        working-directory: apps/app
        run: pnpm tauri bundle --bundles nsis --ci --config tauri-release.conf.json
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Build updater manifest
        shell: bash
        run: node scripts/axolotl/create-updater-manifest.mjs

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: starryisle-windows
          if-no-files-found: error
          retention-days: 14
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/nsis/*.exe.sig
            target/updater/latest.json

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/nsis/*.exe.sig
            target/updater/latest.json
