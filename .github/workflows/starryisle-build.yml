name: StarryIsle build

# Manual runs build the installer for testing; pushing a v* tag also publishes a
# GitHub release with the installer and the updater manifest attached.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: starryisle-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows installer
    runs-on: windows-2025
    env:
      SQLX_OFFLINE: 'true'
      CARGO_PROFILE_RELEASE_LTO: 'true'
      CARGO_TERM_COLOR: always

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.95.0'

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build installer UI
        run: node scripts/axolotl/build-desktop.mjs --profile release --installer-only

      # Both the Gradle distribution and the Electron binary are large GitHub
      # release downloads that time out often; cache the wrapper and relax the
      # wrapper read timeout.
      - name: Restore the Gradle wrapper distribution
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: ~/.gradle/wrapper/dists
          key: gradle-wrapper-${{ runner.os }}-9.1.0
          restore-keys: gradle-wrapper-${{ runner.os }}-
      - name: Prepare build resources
        env:
          ELECTRON_MIRROR: ${{ vars.ELECTRON_MIRROR || 'https://github.com/electron/electron/releases/download/' }}
          GRADLE_OPTS: >-
            -Dorg.gradle.internal.http.socketTimeout=180000
            -Dorg.gradle.internal.http.connectionTimeout=180000
        run: node scripts/axolotl/prepare-build-resources.mjs

      - name: Build application and bundle
        run: node scripts/axolotl/build-desktop.mjs --profile release
        env:
          AXOLOTL_BUILD_RESOURCES: ${{ github.workspace }}/target/build-resources

      - name: Bundle NSIS installer
        working-directory: apps/app
        run: pnpm tauri bundle --bundles nsis --ci --config tauri-release.conf.json --config tauri-modern.conf.json --config tauri-updater.conf.json
        env:
          AXOLOTL_INSTALLER_UI_PATH: ${{ github.workspace }}/target/release/axolotl-installer-ui.exe
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      # 自动更新签名产物还没有时，先不阻断发布：安装包照常产出。
      - name: Build updater manifest
        continue-on-error: true
        shell: bash
        run: node scripts/axolotl/create-updater-manifest.mjs

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: starryisle-windows
          if-no-files-found: warn
          retention-days: 14
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/nsis/*.exe.sig
            target/updater/latest.json

      - name: Resolve release notes
        id: notes
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          file="release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$file" ]; then
            echo "found $file"
            echo "body_path=$file" >> "$GITHUB_OUTPUT"
          else
            echo "no notes file; falling back to generated notes"
            echo "body_path=" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish release with notes
        if: startsWith(github.ref, 'refs/tags/') && steps.notes.outputs.body_path != ''
        uses: softprops/action-gh-release@v2
        with:
          body_path: ${{ steps.notes.outputs.body_path }}
          files: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/nsis/*.exe.sig
            target/updater/latest.json

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/') && steps.notes.outputs.body_path == ''
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/nsis/*.exe.sig
            target/updater/latest.json
