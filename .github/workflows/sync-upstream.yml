name: Sync upstream

# Merges the upstream Axolotl branch into this fork for real: the merge commit
# records upstream/main as a parent, so later syncs are ordinary merges.
# Run it from the Actions tab; it never runs on push, so it cannot start a build.
on:
  workflow_dispatch:
    inputs:
      upstream:
        description: Upstream repository (owner/name)
        required: false
        default: Axolotl-Launcher/Axolotl
      strategy:
        description: Which side wins when both changed the same lines
        required: false
        default: ours
        type: choice
        options:
          - ours
          - theirs

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    name: Merge upstream into main
    runs-on: ubuntu-latest
    steps:
      - name: Check out main with full history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Merge upstream
        env:
          UPSTREAM: ${{ inputs.upstream }}
          STRATEGY: ${{ inputs.strategy }}
        run: |
          set -euo pipefail
          git config user.name "starryisle-sync"
          git config user.email "sync@users.noreply.github.com"

          git remote add upstream "https://github.com/${UPSTREAM}.git" 2>/dev/null || \
            git remote set-url upstream "https://github.com/${UPSTREAM}.git"
          git fetch upstream main --no-tags

          echo "### Before merge"
          git rev-list --count HEAD..upstream/main | sed 's/^/commits behind: /'

          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "already up to date; nothing to merge"
            exit 0
          fi

          if [ "${STRATEGY}" = "theirs" ]; then
            MERGE_ARGS="-X theirs"
          else
            MERGE_ARGS="-X ours"
          fi

          # A real merge: upstream content lands in the tree, our side wins only
          # where the two edits overlap. Modify/delete conflicts cannot be resolved
          # by -X, so every remaining conflict is settled explicitly for our side.
          if ! git merge --no-ff ${MERGE_ARGS} \
            -m "chore(sync): merge upstream main into the StarryIsle fork" \
            upstream/main; then
            echo "### Conflicts (kept on our side)"
            git diff --name-only --diff-filter=U | tee /tmp/conflicts.txt
            while IFS= read -r path; do
              [ -z "$path" ] && continue
              if git checkout --ours -- "$path" 2>/dev/null; then
                git add -- "$path"
              else
                git rm -q --force --ignore-unmatch -- "$path" || true
              fi
            done < /tmp/conflicts.txt
            git commit -m "chore(sync): merge upstream main into the StarryIsle fork"
          fi

          echo "### After merge"
          git rev-list --count HEAD..upstream/main | sed 's/^/commits behind: /'
          git diff --stat upstream/main HEAD | tail -n 40

          # Scheduled workflows may land a commit on main while this job runs, so
          # retry the push after folding their commit into the merge.
          for attempt in 1 2 3 4; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "push rejected (attempt ${attempt}); merging origin/main and retrying"
            git fetch origin main --no-tags
            git merge --no-ff -X ours -m "chore(sync): fold origin/main into the sync merge" origin/main || true
            git commit --no-edit >/dev/null 2>&1 || true
          done
          echo "push still rejected"
          exit 1

      - name: Summary
        if: always()
        run: |
          {
            echo "### Sync result"
            echo "- upstream: \`${{ inputs.upstream }}\`"
            echo "- strategy: \`${{ inputs.strategy }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
